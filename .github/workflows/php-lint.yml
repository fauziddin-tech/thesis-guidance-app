name: PHP Lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
